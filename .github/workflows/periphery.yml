name: Periphery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  periphery:
    name: Run Periphery
    runs-on: macos-26
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "latest-stable"
      - uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: "6.4"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-periphery-macos-26-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Install Periphery
        run: brew install periphery-pro/tap/periphery-cli
      - name: Run Periphery
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
        run: periphery scan --strict -- --build-system native
